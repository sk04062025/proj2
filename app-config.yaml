# app-config.yaml (in your Backstage project)
catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequest: true
  rules:
    - allow: [Component, API, Group, User, Resource, System, Domain]
  locations:
    # ... other locations ...
    - type: url
      target: https://github.com/your-org/my-tyk-apis/blob/main/my-first-api/catalog-info.yaml # or use a wildcard for all APIs in the repo
      # Example for wildcard:
      # target: https://github.com/your-org/my-tyk-apis/tree/main/* /catalog-info.yaml
      # This scans all subdirectories for catalog-info.yaml
      # entityPolicy:
      #   catalog.backstage.io/v1alpha1:
      #     kind: API
      #     maxSize: 1MB
