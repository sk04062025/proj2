{
    "listen_port": 8080,
    "secret": "YOUR_TYK_SECRET",
    "node_options": {
        "use_db_app_configs": false,
        "app_config_path": "/opt/tyk-gateway/apps"
    },
    "storage": {
        "type": "redis",
        "redis_url": "redis:6379",
        "redis_password": "",
        "redis_database": 0,
        "redis_prefix": "tyk"
    },
    "hash_key_encoding": "hex",
    "dont_set_x_forwarded_headers": false,
    "allow_master_config_update": false,
    "log_level": "info",
    "enable_dashboard_api": false
}
